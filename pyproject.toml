[project]
name = "sumo-mcp"
version = "0.2.0"
description = "SUMO-MCP: Autonomous Traffic Simulation Platform with Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "sumolib>=1.20.0",
    "traci>=1.20.0",
    "sumo-rl>=1.4.3",
    "pandas>=2.0.0",
    "requests>=2.31.0"
]

[project.scripts]
sumo-mcp = "sumo_mcp.server:main"

[project.optional-dependencies]
# Advanced RL algorithms (DQN/PPO/A2C single-agent, PettingZoo multi-agent).
# Baseline Q-Learning via sumo-rl works without these extras.
rl = [
    "stable-baselines3>=2.3.0",
    "torch>=2.0.0",
    "tensorboard>=2.15.0",
    "supersuit>=3.9.0",
    "pettingzoo>=1.24.0",
]
# Distributed / large-scale RL. Linux/macOS focused; limited Windows support.
rllib = [
    "ray[rllib]>=2.9.0",
]
dev = [
    "mypy>=1.8.0",
    "flake8>=7.0.0",
    "pytest>=8.0.0",
    "psutil>=5.9.0",
    "types-requests>=2.31.0",
    "types-setuptools>=69.0.0",
    "pandas-stubs>=2.0.0"
]

[tool.uv]
dev-dependencies = [
    "mypy>=1.8.0",
    "flake8>=7.0.0",
    "pytest>=8.0.0",
    "psutil>=5.9.0",
    "types-requests>=2.31.0",
    "types-setuptools>=69.0.0",
    "pandas-stubs>=2.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "requires_sumo: needs a working SUMO installation (binaries + SUMO_HOME)",
    "requires_rl: needs the [rl] extras (stable-baselines3, torch)",
    "network: needs outbound internet access (e.g. OSM download); skipped by default in CI",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sumo_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/sumo_mcp",
    "src/server.py",
    "README.md",
    "LICENSE",
]
