name: CI

on:
  push:
    branches: [main, v0.2-dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (flake8 + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev]
      - name: flake8 (blocking)
        run: flake8 src tests
      - name: mypy (advisory until v0.2 tool-surface rewrite settles)
        run: mypy src/sumo_mcp
        continue-on-error: true

  unit:
    name: unit / protocol (no SUMO) - ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full Python sweep on Linux; boundary versions on macOS/Windows.
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.10" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e .[dev]
      - name: pytest (unit + protocol tiers)
        run: pytest -m "not requires_sumo and not requires_rl and not network" -v

  integration:
    name: integration (real SUMO) - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package + SUMO (pip wheels, all three platforms)
        run: pip install -e .[dev] eclipse-sumo
      - name: Export SUMO_HOME for subsequent steps
        shell: python
        run: |
          import os
          import sumo

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"SUMO_HOME={sumo.SUMO_HOME}\n")
      - name: pytest (requires_sumo tier)
        run: pytest -m "requires_sumo" -v

  rl-smoke:
    name: rl-smoke (QL training, ubuntu only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev] eclipse-sumo
      - name: Export SUMO_HOME for subsequent steps
        shell: python
        run: |
          import os
          import sumo

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"SUMO_HOME={sumo.SUMO_HOME}\n")
      - name: pytest (requires_rl tier)
        run: pytest -m "requires_rl" -v
